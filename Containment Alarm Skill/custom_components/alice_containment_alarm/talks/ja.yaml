AliceEnableContainment:
  default:
    - text: "封鎖プロトコルを起動します。"
  yellow_warning:
    - text: "封鎖プロトコルを完全に実行できませんでした。すべての出入口は本当に閉鎖されていますか？"
  yellow_open_list:
    - text: "未閉鎖の出入口: {open_contacts}。"

AliceDisableContainment:
  default:
    - text: "施設封鎖を解除しました。ハイブはもはや封鎖されていません。"

AliceAcknowledgeAlarm:
  request_pin:
    - text: "セキュリティレベル赤。アクセスコードを入力してください。"
  success:
    - text: "警報を確認しました。セキュリティレベルを正常化しました。"
  failure:
    - text: "アクセスコードが無効です。残り試行回数: {attempts_remaining}。"
  timeout:
    - text: "アクセスコードが受信されませんでした。封鎖プロトコルは継続中です。"

AliceSecurityAlarm:
  triggered:
    - text: "セキュリティ違反！{trigger} で不正アクセスを検知。"
