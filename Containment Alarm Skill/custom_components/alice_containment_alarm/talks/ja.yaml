AliceEnableContainment:
  default:
    - text: "封じ込めモードを有効化しています。"
  yellow_warning:
    - text: "封じ込めモードを完全に満たせませんでした。すべてのドアと窓は本当に閉まっていますか？"
  yellow_open_list:
    - text: "開いているもの: {open_contacts}。"

AliceDisableContainment:
  default:
    - text: "封じ込めモードを無効化しました。"

AliceAcknowledgeAlarm:
  request_pin:
    - text: "アラームが作動中です。セキュリティ PIN を入力してください。"
  success:
    - text: "アラームを確認しました。セキュリティレベルを正常化しました。"
  failure:
    - text: "PIN が無効です。残り試行回数: {attempts_remaining}。"
  timeout:
    - text: "PIN が受信されませんでした。アラームは継続中です。"

AliceSecurityAlarm:
  triggered:
    - text: "セキュリティアラーム！{trigger} が開きました。"
